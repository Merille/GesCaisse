@model List<EasytransitCaisse.Models.Client>

    @if (TempData["Success"] != null)
    {
    <div class="alert alert-success alert-dismissible fade show">
        ✅ @TempData["Success"]
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    }

    <!-- Formulaire import caché -->
    <form method="post" asp-action="Import" enctype="multipart/form-data" id="importForm">
        <input type="file" name="file" accept=".xlsx" id="importFile" style="display:none"
               onchange="document.getElementById('importForm').submit()" />
    </form>

    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Clients</h3>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-outline-primary"
                        onclick="document.getElementById('importFile').click()">
                    📤 Importer Excel
                </button>
                <a href="@Url.Action(" Export")" class="btn btn-success">
                    📥 Exporter Excel
                </a>
                <a href="/Client/Create" class="btn btn-primary">
                    + Nouveau client
                </a>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table id="clientsTable" class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Code</th>
                            <th>Société</th>
                            <th>Contact</th>
                            <th>Téléphone</th>
                            <th width="180">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        @foreach (var c in Model)
                        {
                        <tr>
                            <td>@c.CodeClient</td>
                            <td class="fw-semibold">@c.NomSociete</td>
                            <td>@c.NomContact</td>
                            <td>@c.Telephone</td>
                            <td>
                                <a href="/Client/Edit/@c.Id" class="btn btn-warning btn-sm">Modifier</a>
                                <a href="/Client/Delete/@c.Id"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Supprimer ce client ?')">Supprimer</a>
                            </td>
                        </tr>
                        }
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    @section Scripts {
    <script>
        $(document).ready(function () {
            $('#clientsTable').DataTable({
                language: {
                    url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/fr-FR.json'
                },
                pageLength: 10,
                lengthMenu: [10, 25, 50, 100],
                order: [[1, 'asc']],
                columnDefs: [
                    { orderable: false, targets: 4 }
                ],
                dom: '<"d-flex justify-content-between align-items-center mb-3"lf>rtip'
            });
        });
    </script>
    }
